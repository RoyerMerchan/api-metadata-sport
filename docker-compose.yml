services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: footlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
      POSTGRES_DB: footlab
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["footlab-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footlab -d footlab"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  footlab-data:
