name: FOOTLAB CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: footlab
          POSTGRES_PASSWORD: test_local_only
          POSTGRES_DB: footlab_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U footlab -d footlab_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://footlab:test_local_only@localhost:5432/footlab_test
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-test-only-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-test-only-refresh-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @footlab/shared build
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm db:migrate:deploy && pnpm --filter @footlab/api test:integration
      - run: pnpm build
